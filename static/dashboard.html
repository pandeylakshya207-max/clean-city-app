<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2ea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/ui.css">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
<title>Clean City - Municipal dashboard</title>
<style>
  .top-actions { display: flex; gap: 8px; }
  .page-title { margin: 4px 2px 16px; }
  .page-title h1 { font-size: 30px; }
  .page-title p { color: var(--stone); margin-top: 4px; }
  .promo { display: flex; align-items: center; gap: 16px; margin-top: 12px; padding: 20px; text-decoration: none; }
  .promo .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--lime); color: var(--ink); display: grid; place-items: center; flex: none; }
  .promo .ic svg { width: 26px; height: 26px; }
  .promo h2 { font-size: 18px; }
  .promo p { font-size: 13.5px; margin-top: 3px; }
  .promo .go { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.25); color: var(--lime); display: grid; place-items: center; flex: none; margin-left: auto; }
  .promo .go svg { width: 20px; height: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .rc { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .rc + .rc { margin-top: 0; }
  .photo { position: relative; background: var(--ink); }
  .photo img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
  .photo .tl { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; right: 12px; }
  .photo .bl { position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .gchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
  .gchip.id { background: var(--paper); color: var(--ink); }
  .gchip.fake { background: var(--red); color: #fff; }
  .rc-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .addr { font-family: var(--head); font-weight: 700; font-size: 16.5px; letter-spacing: -0.01em; line-height: 1.25; }
  .meta { font-size: 13px; color: var(--stone); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta a { font-weight: 600; text-decoration: none; }
  .note { font-size: 13.5px; padding: 10px 12px; border-radius: 12px; background: var(--mist); color: var(--ink-2); }
  .note.bad { background: var(--red-bg); color: var(--red); }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ba figure { margin: 0; position: relative; }
  .ba img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; display: block; }
  .ba figcaption { position: absolute; left: 8px; bottom: 8px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--lime); color: var(--ink); }
  .ba .before figcaption { background: rgba(23, 33, 27, 0.75); color: #fff; }
  .acts { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 12px; background: #fbfcfa; }
  .act-row { display: flex; gap: 8px; align-items: center; }
  .act-row .input { min-height: 46px; padding: 10px 14px; font-size: 15px; flex: 1; min-width: 0; }
  .upload {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md);
    border: 1.5px dashed #c9d4c4; background: var(--paper); cursor: pointer; flex: 1; min-width: 0;
  }
  .upload:focus-within { border-color: var(--ink); }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .upload .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--lime-soft); color: var(--leaf); display: grid; place-items: center; flex: none; overflow: hidden; }
  .upload .ic svg { width: 20px; height: 20px; }
  .upload .ic img { width: 100%; height: 100%; object-fit: cover; }
  .upload .t { font-size: 13.5px; font-weight: 600; min-width: 0; }
  .upload .t small { display: block; color: var(--stone); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reject-open { background: none; border: 0; color: var(--red); font-weight: 600; font-size: 14px; padding: 2px 0; text-align: left; }
  .act-msg { font-size: 13px; color: var(--red); min-height: 0; }
  .act-msg:empty { display: none; }
  .filter-note { display: flex; align-items: center; gap: 10px; margin: 18px 2px 12px; }
  .gchip.type { background: var(--lime); color: var(--ink); }
  .gchip.late { background: var(--red); color: #fff; }
  .due { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; padding: 9px 12px; border-radius: 12px; background: var(--mist); color: var(--ink-2); }
  .due svg { width: 16px; height: 16px; flex: none; }
  .due.soon { background: var(--amber-bg); color: var(--amber); }
  .due.late { background: var(--red-bg); color: var(--red); }
  .verify { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 10px 12px; border-radius: 12px; }
  .verify svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
  .verify.ok { background: var(--green-bg); color: var(--green); }
  .verify.bad { background: var(--red-bg); color: var(--red); font-weight: 600; }
  .verify.none { background: var(--mist); color: var(--stone); }
  .suggest { font-size: 12.5px; color: var(--stone); margin-top: -4px; }
  .suggest button { background: none; border: 0; padding: 0; color: var(--leaf); font-weight: 700; font-size: 12.5px; }
  #type-filters { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="app wide">
  <div class="topbar">
    <div class="hello">
      <a class="avatar" id="avatar" href="/profile" aria-label="My profile" style="text-decoration:none">S</a>
      <div class="hello-text">
        <div class="greet" id="greet">Hello</div>
        <div class="who" id="who"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="refresh-btn" type="button" aria-label="Refresh reports" data-icon="refresh"></button>
      <button class="icon-btn" id="logout-btn" type="button" aria-label="Log out" data-icon="logout"></button>
    </div>
  </div>

  <div class="page-title">
    <h1>Municipal dashboard</h1>
    <p id="summary">Loading reports...</p>
  </div>

  <div class="stats four" id="stats" role="group" aria-label="Filter by status">
    <button class="stat dark" type="button" data-s="pending"><span class="num" id="c-pending">0</span><span class="lbl">Waiting</span></button>
    <button class="stat" type="button" data-s="assigned"><span class="num" id="c-assigned">0</span><span class="lbl">Team assigned</span></button>
    <button class="stat lime" type="button" data-s="cleaned"><span class="num" id="c-cleaned">0</span><span class="lbl">Cleaned</span></button>
    <button class="stat" type="button" data-s="rejected"><span class="num" id="c-rejected">0</span><span class="lbl">Rejected</span></button>
  </div>

  <a class="hero promo" href="/hotspots">
    <span class="ic" data-icon="flame"></span>
    <span>
      <h2>Where garbage keeps coming back</h2>
      <p>Open the hotspot map to plan bins, signs and cleaning rounds.</p>
    </span>
    <span class="go" data-icon="arrow"></span>
  </a>

  <div class="filter-note">
    <h2 id="list-title">All reports</h2>
    <button class="link-btn" id="show-all" type="button" hidden>Show all</button>
  </div>
  <div class="chips" id="type-filters" role="group" aria-label="Filter by garbage type" hidden></div>
  <div id="list" class="grid"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>

<nav class="nav" aria-label="Main">
  <a href="/dashboard" class="on" aria-label="Dashboard" data-icon="list"></a>
  <a href="/hotspots" class="main" aria-label="Hotspot map" data-icon="map"></a>
  <a href="/city" aria-label="City scoreboard" data-icon="city"></a>
</nav>

<script src="/static/shrink.js"></script>
<script src="/static/ui.js"></script>
<script>
const $ = CC.$;
const el = CC.el;
CC.fillIcons();
const TITLES = { "": "All reports", pending: "Waiting for a team", assigned: "Team assigned", cleaned: "Cleaned", rejected: "Rejected" };
let currentStatus = "";
let typeFilter = "";
let allComplaints = [];

function staffPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
}

function distanceText(m) {
  return m >= 1000 ? (m / 1000).toFixed(1) + " km" : Math.round(m) + " m";
}

function percent(value) {
  return value === null || value === undefined ? "not checked" : Math.round(value * 100) + "%";
}

function renderCounts(counts) {
  for (const s of ["pending", "assigned", "cleaned", "rejected"]) $("c-" + s).textContent = counts[s] || 0;
  document.querySelectorAll("#stats .stat").forEach((b) => {
    b.classList.toggle("active", b.dataset.s === currentStatus);
    b.setAttribute("aria-pressed", b.dataset.s === currentStatus ? "true" : "false");
  });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const open = (counts.pending || 0) + (counts.assigned || 0);
  $("summary").textContent = CC.plural(total, "report", "reports") + " in total, " + open + " still open.";
  $("list-title").textContent = TITLES[currentStatus];
  $("show-all").hidden = !currentStatus;
}

function renderActions(c) {
  const box = el("div", "acts");
  const msg = el("div", "act-msg");
  msg.setAttribute("role", "alert");
  const base = "/api/staff/complaints/" + c.id;

  const run = async (btn, work, done) => {
    msg.textContent = "";
    btn.disabled = true;
    try {
      await work();
      CC.toast(done);
      await load();
    } catch (err) {
      msg.textContent = err.message;
      btn.disabled = false;
    }
  };
  const postJson = (path, body) => CC.api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  const assignRow = el("div", "act-row");
  const team = el("input", "input");
  team.type = "text";
  team.placeholder = "Team or worker name";
  team.maxLength = 100;
  team.value = c.assigned_to || "";
  team.setAttribute("aria-label", "Team or worker name for report " + c.id);
  const assignBtn = el("button", "btn sm", c.status === "assigned" ? "Change team" : "Assign");
  assignBtn.type = "button";
  assignBtn.addEventListener("click", () => run(assignBtn, () => postJson(base + "/assign", { team: team.value }), "Team assigned to report #" + c.id + "."));
  assignRow.appendChild(team);
  assignRow.appendChild(assignBtn);
  box.appendChild(assignRow);
  if (c.garbage_type && c.status === "pending") {
    const hint = el("div", "suggest", "Suggested for " + c.garbage_type.name.toLowerCase() + ": ");
    const use = el("button", "", c.garbage_type.team);
    use.type = "button";
    use.addEventListener("click", () => { team.value = c.garbage_type.team; team.focus(); });
    hint.appendChild(use);
    box.appendChild(hint);
  }

  const cleanRow = el("div", "act-row");
  const label = el("label", "upload");
  const file = el("input");
  file.type = "file";
  file.accept = "image/*";
  file.setAttribute("capture", "environment");
  file.setAttribute("aria-label", "Photo after cleaning for report " + c.id);
  const ic = el("span", "ic");
  ic.innerHTML = CC.icon("upload");
  const t = el("span", "t", "After-cleaning photo");
  const sub = el("small", "", "Tap to take or choose a photo");
  t.appendChild(sub);
  label.appendChild(file);
  label.appendChild(ic);
  label.appendChild(t);
  file.addEventListener("change", () => {
    if (!file.files.length) return;
    sub.textContent = file.files[0].name;
    const img = el("img");
    img.alt = "";
    img.src = URL.createObjectURL(file.files[0]);
    ic.replaceChildren(img);
  });
  const cleanBtn = el("button", "btn sm lime", "Mark cleaned");
  cleanBtn.type = "button";
  cleanBtn.addEventListener("click", () => run(cleanBtn, async () => {
    if (!file.files.length) throw new Error("First take or choose the photo of the cleaned spot.");
    const small = await shrinkPhoto(file.files[0]);
    cleanBtn.textContent = "Checking...";
    const here = await staffPosition();
    const send = (confirmed) => {
      const form = new FormData();
      form.append("photo", small, "after.jpg");
      form.append("confirm", confirmed ? "true" : "false");
      if (here) {
        form.append("latitude", here.latitude);
        form.append("longitude", here.longitude);
      }
      return CC.api(base + "/clean", { method: "POST", body: form });
    };
    try {
      await send(false);
    } catch (err) {
      if (err.status !== 409) throw err;
      const ok = window.confirm("This photo still seems to show garbage. Mark the report as cleaned anyway?");
      if (!ok) throw new Error("Not uploaded. Take a photo of the cleaned spot and try again.");
      await send(true);
    } finally {
      cleanBtn.textContent = "Mark cleaned";
    }
  }, "Report #" + c.id + " marked cleaned. The reporter has been told."));
  cleanRow.appendChild(label);
  cleanRow.appendChild(cleanBtn);
  box.appendChild(cleanRow);

  const openReject = el("button", "reject-open", "Reject this report");
  openReject.type = "button";
  const rejectRow = el("div", "act-row");
  rejectRow.hidden = true;
  const reason = el("input", "input");
  reason.type = "text";
  reason.placeholder = "Reason, shown to the reporter";
  reason.maxLength = 300;
  reason.setAttribute("aria-label", "Reason for rejecting report " + c.id);
  const rejectBtn = el("button", "btn sm danger", "Reject");
  rejectBtn.type = "button";
  rejectBtn.addEventListener("click", () => run(rejectBtn, () => postJson(base + "/reject", { reason: reason.value }), "Report #" + c.id + " rejected."));
  openReject.addEventListener("click", () => {
    openReject.hidden = true;
    rejectRow.hidden = false;
    reason.focus();
  });
  rejectRow.appendChild(reason);
  rejectRow.appendChild(rejectBtn);
  box.appendChild(openReject);
  box.appendChild(rejectRow);
  box.appendChild(msg);
  return box;
}

function figure(cls, url, alt, caption) {
  const f = el("figure", cls);
  const a = el("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  const img = el("img");
  img.src = url;
  img.alt = alt;
  img.loading = "lazy";
  a.appendChild(img);
  f.appendChild(a);
  f.appendChild(el("figcaption", "", caption));
  return f;
}

function renderCard(c) {
  const card = el("article", "card rc");
  const body = el("div", "rc-body");

  if (c.after_photo_url) {
    const top = el("div", "photo");
    top.style.background = "var(--paper)";
    const ba = el("div", "ba");
    ba.style.padding = "12px 12px 0";
    ba.appendChild(figure("before", c.photo_url, "Reported photo for report " + c.id, "Before"));
    ba.appendChild(figure("after", c.after_photo_url, "Photo after cleaning for report " + c.id, "After"));
    top.appendChild(ba);
    card.appendChild(top);
  } else {
    const photo = el("div", "photo");
    const a = el("a");
    a.href = c.photo_url;
    a.target = "_blank";
    a.rel = "noopener";
    const img = el("img");
    img.src = c.photo_url;
    img.alt = "Reported photo for report " + c.id;
    img.loading = "lazy";
    a.appendChild(img);
    photo.appendChild(a);
    const bl = el("div", "bl");
    if (c.garbage_type) bl.appendChild(el("span", "gchip type", c.garbage_type.name));
    bl.appendChild(el("span", "gchip glass", "Garbage " + percent(c.garbage_score)));
    bl.appendChild(el("span", "gchip glass", "AI-generated " + percent(c.fake_score)));
    if (c.possible_fake) bl.appendChild(el("span", "gchip fake", "Possible fake, check first"));
    photo.appendChild(bl);
    card.appendChild(photo);
  }

  const head = el("div", "r-top");
  head.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:8px";
  const idBox = el("span");
  idBox.style.cssText = "display:flex;gap:6px;flex-wrap:wrap";
  idBox.appendChild(el("span", "gchip id", "#" + c.id));
  if (c.escalated && (c.status === "pending" || c.status === "assigned")) idBox.appendChild(el("span", "gchip late", "Escalated"));
  if (c.reopened) idBox.appendChild(el("span", "badge warn", "Reopened"));
  head.appendChild(idBox);
  head.appendChild(CC.badge(c.status));
  body.appendChild(head);
  body.appendChild(el("div", "addr", c.address || "Address not found"));

  const meta = el("div", "meta");
  const map = el("a", "", "Open in Google Maps");
  map.href = "https://www.google.com/maps?q=" + c.latitude + "," + c.longitude;
  map.target = "_blank";
  map.rel = "noopener";
  meta.appendChild(map);
  meta.appendChild(el("span", "", c.latitude.toFixed(5) + ", " + c.longitude.toFixed(5)));
  body.appendChild(meta);
  body.appendChild(el("div", "meta", "By " + c.reporter + ", " + CC.formatDate(c.created_at)));
  if (c.ward) body.appendChild(el("div", "meta", "Ward " + c.ward.no + ": " + c.ward.name));
  if ((c.status === "pending" || c.status === "assigned") && c.hours_left !== null && c.hours_left !== undefined) {
    const due = el("div", "due" + (c.overdue ? " late" : c.hours_left < 12 ? " soon" : ""));
    due.innerHTML = CC.icon("clock");
    due.appendChild(el("span", "", c.overdue
      ? "Overdue by " + CC.hoursText(c.hours_left) + (c.escalated ? ", escalated to a senior officer" : "")
      : CC.hoursText(c.hours_left) + " left to clean (48-hour deadline)"));
    body.appendChild(due);
  }
  if (c.description) body.appendChild(el("div", "note", "Note: " + c.description));
  if (c.assigned_to) body.appendChild(el("div", "meta", "Team: " + c.assigned_to));
  if (c.status === "cleaned" && c.cleaned_at) body.appendChild(el("div", "meta", "Cleaned " + CC.formatDate(c.cleaned_at) + (c.on_time === false ? ", after the deadline" : c.on_time ? ", on time" : "")));
  if (c.status === "cleaned") body.appendChild(verifyLine(c));
  if (c.status === "rejected" && c.staff_note) body.appendChild(el("div", "note bad", "Rejected: " + c.staff_note));
  card.appendChild(body);

  if (c.status === "pending" || c.status === "assigned") card.appendChild(renderActions(c));
  return card;
}

function verifyLine(c) {
  const parts = [];
  if (c.after_similarity !== null && c.after_similarity !== undefined) parts.push("scene match " + Math.round(c.after_similarity * 100) + "%");
  if (c.after_distance_m !== null && c.after_distance_m !== undefined) parts.push("photo taken " + distanceText(c.after_distance_m) + " from the spot");
  let cls = "none";
  let icon = "shield";
  let text = "Not checked: this cleaning was recorded before the proof-of-clean check.";
  if (c.clean_check === "verified") {
    cls = "ok";
    text = "Proof of clean: the after photo shows the same place";
  } else if (c.clean_check === "flagged") {
    cls = "bad";
    icon = "alert";
    text = "Check this cleaning: the after photo may not be of the reported place";
  }
  const box = el("div", "verify " + cls);
  box.innerHTML = CC.icon(icon);
  box.appendChild(el("span", "", text + (parts.length ? " (" + parts.join(", ") + ")." : ".")));
  return box;
}

function renderTypeFilters() {
  const box = $("type-filters");
  const counts = {};
  let overdue = 0;
  for (const c of allComplaints) {
    if (c.garbage_type) counts[c.garbage_type.name] = (counts[c.garbage_type.name] || 0) + 1;
    if (c.overdue) overdue += 1;
  }
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  box.replaceChildren();
  box.hidden = !names.length && !overdue;
  const chip = (key, label) => {
    const b = el("button", "chip" + (typeFilter === key ? " on" : ""), label);
    b.type = "button";
    b.addEventListener("click", () => { typeFilter = typeFilter === key ? "" : key; renderList(); });
    box.appendChild(b);
  };
  chip("", "All types");
  if (overdue) chip("__overdue", "Overdue (" + overdue + ")");
  names.forEach((n) => chip(n, n + " (" + counts[n] + ")"));
}

function renderList() {
  renderTypeFilters();
  const list = $("list");
  list.replaceChildren();
  const shown = allComplaints.filter((c) =>
    !typeFilter ? true : typeFilter === "__overdue" ? c.overdue : c.garbage_type && c.garbage_type.name === typeFilter);
  if (!shown.length) {
    const empty = el("div", "empty card");
    const big = el("div", "big");
    big.innerHTML = CC.icon("check");
    empty.appendChild(big);
    empty.appendChild(el("h3", "", "Nothing here"));
    empty.appendChild(el("p", "small", currentStatus || typeFilter ? "No reports match this filter." : "New reports from citizens will appear here."));
    list.appendChild(empty);
    return;
  }
  for (const c of shown) list.appendChild(renderCard(c));
}

async function load() {
  const list = $("list");
  try {
    const query = currentStatus ? "?status=" + currentStatus : "";
    const data = await CC.api("/api/staff/complaints" + query);
    renderCounts(data.counts);
    allComplaints = data.complaints;
    if (typeFilter && typeFilter !== "__overdue" && !allComplaints.some((c) => c.garbage_type && c.garbage_type.name === typeFilter)) typeFilter = "";
    renderList();
  } catch (err) {
    list.replaceChildren(el("div", "empty card", err.message));
  }
}

$("stats").addEventListener("click", (e) => {
  const b = e.target.closest(".stat");
  if (!b) return;
  currentStatus = currentStatus === b.dataset.s ? "" : b.dataset.s;
  load();
});
$("show-all").addEventListener("click", () => { currentStatus = ""; load(); });
$("refresh-btn").addEventListener("click", () => { load(); CC.toast("Reports refreshed."); });
$("logout-btn").addEventListener("click", CC.logout);

(async () => {
  if (!CC.token()) {
    CC.logout();
    return;
  }
  $("greet").textContent = CC.greeting();
  let user;
  try {
    user = await CC.api("/api/me");
  } catch (err) {
    return;
  }
  $("who").textContent = user.contact;
  $("avatar").textContent = CC.initial(user.name || user.contact);
  if (user.name) $("greet").textContent = CC.greeting() + ", " + user.name.split(" ")[0];
  if (user.role !== "staff") {
    const box = el("div", "empty card");
    box.appendChild(el("h3", "", "This page is for municipal staff"));
    const link = el("a", "", "Go to the report page");
    link.href = "/report";
    box.appendChild(link);
    $("list").replaceChildren(box);
    $("summary").textContent = "";
    return;
  }
  load();
})();
</script>
</body>
</html>
